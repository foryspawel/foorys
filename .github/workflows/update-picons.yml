name: Aktualizuj picony

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: write

jobs:
  update-picons:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Odśwież mirror Chocholousek
        shell: pwsh
        run: ./tools/update_picons.ps1

      - name: Zapisz zmiany
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json picons/
          if git diff --cached --quiet; then
            echo "Picony i manifest są aktualne."
            exit 0
          fi
          git commit -m "chore: update picon mirror"
          git push
