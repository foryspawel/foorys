# Foorys Relay: osobny host TLS na porcie 9443.
# Aplikacja firmowa na porcie 80 pozostaje poza tym plikiem.

server {
    listen 9443 ssl default_server;
    listen [::]:9443 ssl default_server;
    server_name _;
    ssl_certificate /etc/nginx/ssl/foorys-relay-fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/foorys-relay.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 444;
}

server {
    listen 9443 ssl;
    listen [::]:9443 ssl;
    server_name raport.forys.pro;
    ssl_certificate /etc/nginx/ssl/foorys-relay-fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/foorys-relay.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    location / {
        proxy_pass http://127.0.0.1:9444;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }
}
