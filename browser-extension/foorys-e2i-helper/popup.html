<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Foorys E2i Helper</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header>
      <img src="icons/foorys-128.png" alt="Logo Foorys">
      <div>
        <p class="eyebrow">E2IPLAYER · LOCAL HELPER</p>
        <h1>Foorys E2i Helper</h1>
      </div>
    </header>
    <label for="decoder">Adres dekodera</label>
    <input id="decoder" inputmode="url" placeholder="192.168.18.177:9001">
    <button id="save">Zapisz adres</button>
    <button id="open" class="secondary">Otwórz stronę dekodera</button>
    <hr>
    <label for="relay">Adres Foorys Relay</label>
    <input id="relay" type="url" placeholder="https://raport.forys.pro:9443">
    <label for="capture-code">Awaryjny kod CAPTCHA</label>
    <input id="capture-code" class="capture-code" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" placeholder="6 cyfr">
    <button id="activate">Aktywuj kod awaryjny</button>
    <button id="clear" class="secondary">Wyczyść kod</button>
    <p class="hint">Najprościej: w panelu Relay kliknij „Otwórz CAPTCHA zdalnie” i otwórz skopiowany link. Sesja sama połączy Chrome z właściwym dekoderem. Kod awaryjny służy tylko do starszego, ręcznego trybu. Weryfikację Cloudflare zawsze zatwierdź ręcznie.</p>
    <p id="status" role="status"></p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
